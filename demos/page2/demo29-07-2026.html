
<!DOCTYPE html>
<html lang="en">
<head> 
    <title>Page 2</title> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:set-default;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}

.back-button {
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;
  z-index: 1000;
  width: 48px;
  height: 48px;
  display: inline-block;
  transition: transform .2s ease, opacity .2s ease;
}

.back-button img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.back-button:hover {
  transform: scale(1.08);
  opacity: .8;
}

#scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#bg{
    position:absolute;
    inset:0;

    background-image:url("./images/placeholder.jpg");
    background-size:cover;
    background-position:center;

    transition:
        filter .5s,
        transform .3s;
}

.hotspot{
    border:2px solid red;
    position:absolute;
    width:120px;
    height:120px;
    opacity:1;
}

.window{
    position:absolute;

    width:220px;
    height:220px;

    border:1px solid rgba(255,255,255,.15);
    background:black;

    overflow:hidden;

    backdrop-filter:blur(5px);

    box-shadow:
    0 0 20px rgba(255,255,255,.1);

    animation:appear .4s ease;
}

.window .crop{

    width:100%;
    height:100%;

    background-image:url("./images/placeholder.jpg");
    background-size:cover;
    position:absolute;
}


</style>

<body>
    
<!-- universal back button: copy this whole <a> block into any subpage.
 swap the src for your own icon image. -->
<a class="back-button" href="index.html">
    <img src="./images/back-arrow.png" alt="Back">
</a>

<div id="scene">

<div id="bg"></div>

<div class="hotspot"
style="left:27%;top:65%; height: 140px; width: 105px;"></div>

<div class="hotspot"
style="left:55%;top:28%; height: 170px;"></div>

</div>

<div class="cursor"></div>

<script>

const scene=document.getElementById("scene")
const bg=document.getElementById("bg")

let dragging=false
let startX,startY

//-----------------------------------
// hotspots

document.querySelectorAll(".hotspot")
.forEach(h=>{

h.addEventListener("click",e=>{

spawnWindow(
e.clientX,
e.clientY,
h.offsetLeft,
h.offsetTop)

})

})


//-----------------------------------

function spawnWindow(x,y,bx,by){

let win=document.createElement("div")
win.className="window"

win.style.left=
x+(Math.random()*120-60)+"px"

win.style.top=
y+(Math.random()*120-60)+"px"

let crop=document.createElement("div")
crop.className="crop"

crop.style.backgroundPosition=
`${-bx}px ${-by}px`

crop.style.transform=
`
scale(${1+Math.random()*0.8})
rotate(${Math.random()*10-5}deg)
`

crop.style.filter=
`
hue-rotate(${Math.random()*120}deg)
contrast(1.3)
`

win.appendChild(crop)

scene.appendChild(win)
}

</script>

</body>
</html>
