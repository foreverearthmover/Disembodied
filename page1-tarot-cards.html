osition:absolute;inset:0;width:100%;height:100%;border-radius:12px;overflow:hidden;backface-visibility:hidden;border:1px solid #000}.card-front img{width:100%;height:100%;object-fit:cover;display:block}.card-back{transform:rotateY(180deg);background:#fff}.result-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.dark-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);opacity:0;transition:opacity .4s ease}.card-content{position:absolute;inset:0;display:flex;z-index:2;opacity:0;transition:opacity .4s ease}.card-back.show-text .card-content,.card-back.show-text .dark-overlay{opacity:1}.result-title{writing-mode:vertical-rl;transform:rotate(180deg);font-family:Helvetica,Arial,sans-serif;font-weight:700;font-size:3.6rem;color:#adb6ff;margin:12px;line-height:.8}.text-box{flex:1;display:flex;align-items:flex-start;padding:20px 18px}.result-text{color:#fff;font-size:.95rem;line-height:1.4;font-family:Consolas,monospace}</style> </head> <body> <a class=back-button href=index.html aria-label="Go back to homepage"> <img src=./images/back-button.svg alt=Homepage-Link> </a> <form id=question-screen label="Enter a question" aria-label="Enter a question"> <h1>Enter your question</h1> <input id=question> <button id=begin type=submit>Continue</button> </form> <section id=selection-screen> <h2 id=questionText></h2> <p>Move your mouse among the cards and choose your answer.</p> <div id=objects> <div class=card data-item=0> <div class=card-inner> <div class=card-front> <img src=./images/card-front-alt.webp> </div> <div class=card-back> <img class=result-image> <div class=dark-overlay></div> <div class=card-content> <h2 class=result-title></h2> <div class=text-box> <p class=result-text></p> </div> </div> </div> </div> </div> <div class=card data-item=1> <div class=card-inner> <div class=card-front> <img src=./images/card-front.webp> </div> <div class=card-back> <img class=result-image> <div class=dark-overlay></div> <div class=card-content> <h2 class=result-title></h2> <div class=text-box> <p class=result-text></p> </div> </div> </div> </div> </div> <div class=card data-item=2> <div class=card-inner> <div class=card-front> <img src=./images/card-front-alt.webp> </div> <div class=card-back> <img class=result-image> <div class=dark-overlay></div> <div class=card-content> <h2 class=result-title></h2> <div class=text-box> <p class=result-text></p> </div> </div> </div> </div> </div> <div class=card data-item=3> <div class=card-inner> <div class=card-front> <img src=./images/card-front.webp> </div> <div class=card-back> <img class=result-image> <div class=dark-overlay></div> <div class=card-content> <h2 class=result-title></h2> <div class=text-box> <p class=result-text></p> </div> </div> </div> </div> </div> <div class=card data-item=4> <div class=card-inner> <div class=card-front> <img src=./images/card-front-alt.webp> </div> <div class=card-back> <img class=result-image> <div class=dark-overlay></div> <div class=card-content> <h2 class=result-title></h2> <div class=text-box> <p class=result-text></p> </div> </div> </div> </div> </div> <div class=card data-item=5> <div class=card-inner> <div class=card-front> <img src=./images/card-front.webp> </div> <div class=card-back> <img class=result-image> <div class=dark-overlay></div> <div class=card-content> <h2 class=result-title></h2> <div class=text-box> <p class=result-text></p> </div> </div> </div> </div> </div> </div> </section> <script>const items=[{name:"RESIGNATION",images:["./images/Resignation.webp"],text:"You will freeze in place if you remain this way. Go outside where the world awaits you like a garden, go outside to the roses."},{name:"GROWTH",images:["./images/Growth.webp"],text:"The earth has a heart as well as blood and teeth, it’s made up of things so much like you. This vessel, this vessel is a lie, a shapeshifting beast, a lesson in fluidity. There is meaning in the dirt."},{name:"NIGHTMARE",images:["./images/Nightmare.webp"],text: {e.addEventListener("click",(()=>{if(!chosen)return chosen=!0,void reveal(e);e.classList.contains("flipped")&&toggleText(e)}))}));const container=document.getElementById("objects");let timeout;function shuffle(){chosen||(clearTimeout(timeout),document.querySelectorAll(".card").forEach((e=>{const t=5*Math.random(),n=5*Math.random(),o=5*Math.random()-2.5;e.style.transform=`translate(${t}px,${n}px) rotate(${o}deg)`})),timeout=setTimeout((()=>{document.querySelectorAll(".card").forEach((e=>{e.style.transform=""}))}),500))}container.addEventListener("mousemove",shuffle)</script>
